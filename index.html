<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арктические экспедиции — Главная</title>
<link rel="stylesheet" href="./libs/bootstrap-5.3.8-dist/css/bootstrap.min.css">
<script src="./libs/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.hero-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("./images/background.jpg");
    background-size: cover;
    background-position: center;
    filter: brightness(0.5) blur(1px);
    z-index: -2;
}

.hero-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: -1;
}

.navbar {
    background: rgba(0,0,0,0.45) !important;
    backdrop-filter: blur(12px);
    border-radius: 12px;
    margin: 10px 20px;
    width: calc(100% - 40px);
    z-index: 2;
    transition: background 0.3s ease;
}

.navbar:hover {
    background: rgba(0,0,0,0.6) !important;
}

.navbar .navbar-brand,
.navbar .btn {
    color: #fff !important;
    font-weight: 500;
}

.navbar .btn-outline-light {
    border-color: #fff;
}

.navbar .btn-outline-light:hover {
    background: rgba(255,255,255,0.15);
}

.main-card {
    background: rgba(25,25,55,0.7);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px;
    margin-top: 15vh;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    max-width: 400px;
    width: 90%;
}

.main-card h2 {
    margin-bottom: 2rem;
    font-weight: 600;
    color: #fff;
}

.btn-root {
    width: 12rem;
    margin-top: 1rem;
    background: linear-gradient(90deg,#6a11cb,#2575fc);
    border: none;
    color: #fff;
    font-weight: 500;
    border-radius: 12px;
    transition: all 0.3s ease;
}

.btn-root:hover {
    background: linear-gradient(90deg,#2575fc,#6a11cb);
    transform: translateY(-2px);
}

/* ❄️ СНЕЖИНКИ — ТОЧНО КАК НА ДРУГОЙ СТРАНИЦЕ */
.snow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
}

.snowflake {
    position: absolute;
    top: -10%;
    color: #fff;
    opacity: 0.8;
    user-select: none;
    animation-name: snow-fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes snow-fall {
    0% { transform: translateY(-10vh); }
    100% { transform: translateY(110vh); }
}
</style>
</head>

<body>

<div class="hero-bg"></div>

<!-- ❄️ СНЕГ -->
<div class="snow">
    <div class="snowflake" style="left:5%; font-size:14px; animation-duration:16s;">❄</div>
    <div class="snowflake" style="left:15%; font-size:18px; animation-duration:12s;">❄</div>
    <div class="snowflake" style="left:25%; font-size:12px; animation-duration:18s;">❄</div>
    <div class="snowflake" style="left:35%; font-size:22px; animation-duration:10s;">❄</div>
    <div class="snowflake" style="left:45%; font-size:16px; animation-duration:14s;">❄</div>
    <div class="snowflake" style="left:55%; font-size:20px; animation-duration:11s;">❄</div>
    <div class="snowflake" style="left:65%; font-size:15px; animation-duration:17s;">❄</div>
    <div class="snowflake" style="left:75%; font-size:19px; animation-duration:13s;">❄</div>
    <div class="snowflake" style="left:85%; font-size:13px; animation-duration:19s;">❄</div>
    <div class="snowflake" style="left:95%; font-size:21px; animation-duration:12s;">❄</div>
</div>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Интерактивная карта</a>
        <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-light" href="pages/main.html">Маршрут</a>
            <a class="btn btn-sm btn-outline-light" href="pages/sources.html">Материалы</a>
        </div>
    </div>
</nav>

<div class="main-card">
    <h2>Арктические экспедиции</h2>
    <a class="btn btn-root" href="pages/main.html" role="button">В путь!</a>
    <a class="btn btn-root" href="pages/about.html" role="button">О проекте</a>
</div>

</body>
</html>

</html>
